name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache sherpa-onnx AAR
        uses: actions/cache@v4
        with:
          path: app/libs
          key: sherpa-${{ hashFiles('gradle.properties') }}
      - name: Fetch sherpa-onnx
        run: ./scripts/fetch-sherpa-onnx.sh
      - name: Unit tests
        run: ./gradlew :core:text:test testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: murmur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: murmur-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
